{{- with .cxt }}
{{- $cover := partial "get_cover.html" . -}}
{{- if and $cover.has (not $.isHidden) }}
<figure class="entry-cover">
    {{- $loading := cond $.IsSingle "eager" "lazy" }}
    {{- $addLink := (and site.Params.cover.linkFullImages $.IsSingle) }}
    {{- $prod := (hugo.IsProduction | or (eq site.Params.env "production")) }}
    {{- $alt := $cover.alt }}
    {{- $responsiveImages := (.Params.cover.responsiveImages | default site.Params.cover.responsiveImages) | default true }}
    {{- $imgdl := $cover.url }}
    {{- $sizes := (slice "360" "480" "720" "1080" "1500") }}
    {{- $processableFormats := (slice "jpg" "jpeg" "png" "tif" "bmp" "gif" "webp") -}}

    {{- if $addLink }}
        <a href="{{ $imgdl }}" target="_blank" rel="noopener noreferrer">
    {{- end }}

    {{- if $cover.resource -}}
        {{- $img := $cover.resource -}}
        {{- if (and (in $processableFormats $img.MediaType.SubType) $responsiveImages (eq $prod true)) }}
            <img loading="{{ $loading }}"
                srcset='{{- range $size := $sizes -}}
                            {{- if (ge $img.Width $size) }}
                                {{- printf "%s %s" (($img.Resize (printf "%sx" $size)).Permalink) (printf "%sw," $size) }}
                            {{- end }}
                        {{- end }}
                        {{- printf "%s %dw" ($img.Permalink) ($img.Width) }}'
                src="{{ $img.Permalink }}"
                sizes="(min-width: 768px) 720px, 100vw"
                width="{{ $img.Width }}" height="{{ $img.Height }}"
                alt="{{ $alt }}">
        {{- else }}
            <img loading="{{ $loading }}" src="{{ $imgdl }}" width="{{ $img.Width }}" height="{{ $img.Height }}" alt="{{ $alt }}">
        {{- end }}
    {{- else }}
        <img loading="{{ $loading }}" src="{{ $imgdl }}" alt="{{ $alt }}">
    {{- end }}

    {{- if $addLink }}
        </a>
    {{- end -}}

    {{- if $.IsSingle }}
        {{ with $cover.caption -}}
            <figcaption>{{ . | markdownify }}</figcaption>
        {{- end }}
    {{- end }}
</figure>
{{- end }}
{{- end -}}
